<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ASHFALL — Survival</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0d0f12;--panel:rgba(18,21,26,.94);--panel2:#1a1e25;--line:#2c333d;--tx:#e6e2d8;--dim:#8d939c;--ember:#ff7a2f;--ember2:#ffb15c;--good:#7fd66b;--bad:#ff5a4d;--ice:#66d0ff}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#000;color:var(--tx);font-family:"Segoe UI",Inter,system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
/* ---------- menus ---------- */
#menus{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 120%,#5a2410 0%,#1c1512 45%,#0a0c0f 100%);display:flex;align-items:center;justify-content:center;z-index:20;overflow:auto}
#bgc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.screen{position:relative;z-index:2;width:min(960px,94vw);max-height:96vh;display:none;flex-direction:column;gap:14px}
.screen.on{display:flex}
.logo{font-size:clamp(44px,9vw,104px);font-weight:800;letter-spacing:.22em;margin:0 0 0 .22em;text-align:center;background:linear-gradient(180deg,#ffd9a0,#ff7a2f 55%,#7a2a0c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 24px rgba(255,90,20,.35))}
.tag{text-align:center;color:var(--dim);letter-spacing:.35em;font-size:12px;text-transform:uppercase;margin-top:-6px}
.mainbtns{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:28px}
.btn{background:linear-gradient(180deg,#252b34,#1a1e25);border:1px solid var(--line);padding:12px 22px;border-radius:6px;letter-spacing:.14em;font-weight:700;font-size:14px;text-transform:uppercase;transition:.12s;min-width:150px}
.btn:hover{border-color:var(--ember);color:#fff;background:linear-gradient(180deg,#3a2a20,#2a1d15);box-shadow:0 0 18px rgba(255,122,47,.25)}
.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.btn.big{min-width:320px;padding:15px 22px;font-size:16px}
.btn.cta{background:linear-gradient(180deg,#ff8a3d,#d4561a);border-color:#ffb15c;color:#1a0d05;font-size:18px;padding:16px 40px;box-shadow:0 0 24px rgba(255,122,47,.4)}
.btn.cta:hover{background:linear-gradient(180deg,#ffa055,#e8631f);color:#000}
.btn.sm{padding:6px 12px;font-size:12px;min-width:0}
.btn.danger:hover{border-color:var(--bad);background:#3a1d1a;box-shadow:0 0 18px rgba(255,90,77,.25)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 22px;overflow:auto}
h2.st{margin:0;font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:var(--ember2)}
h4{margin:14px 0 6px;color:var(--ember);letter-spacing:.18em;font-size:12px;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:4px}
.row{display:flex;gap:12px;align-items:center;margin:7px 0;flex-wrap:wrap}
.row>label{min-width:170px;color:var(--dim);font-size:13px}
input[type=text],input[type=number],select{background:#0f1216;color:var(--tx);border:1px solid var(--line);border-radius:5px;padding:8px 10px;font:inherit;min-width:190px;-webkit-user-select:text;user-select:text}
input[type=text]:focus,select:focus{outline:none;border-color:var(--ember)}
input[type=range]{accent-color:var(--ember);width:200px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.chk{display:flex;align-items:center;gap:9px;padding:5px 0;cursor:pointer;font-size:14px}
.chk input{appearance:none;width:20px;height:20px;border:1px solid #4a525d;border-radius:4px;background:#0f1216;display:grid;place-content:center;cursor:pointer;margin:0}
.chk input:checked{background:var(--ember);border-color:var(--ember2)}
.chk input:checked::after{content:"✔";color:#1a0d05;font-size:14px;font-weight:900}
.chk input:disabled{opacity:.35}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#12161b;padding:7px 14px;border-radius:20px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--dim)}
.chip.on{background:var(--ember);color:#1a0d05;border-color:var(--ember2)}
.wl{display:flex;flex-direction:column;gap:8px}
.wrow{display:flex;align-items:center;gap:14px;background:#11151a;border:1px solid var(--line);border-radius:8px;padding:12px 16px}
.wrow:hover{border-color:#5a3a26}
.wrow .nm{font-weight:700;font-size:17px}.wrow .sub{font-size:12px;color:var(--dim);margin-top:3px}
.wrow .grow{flex:1}
.badge{font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;border-radius:9px;background:#2b333d;margin-right:6px;color:#cbd2da}
.badge.survival{background:#3d5a2e}.badge.creative{background:#2e4d6a}.badge.peaceful{background:#2e6a5c}.badge.hardcore{background:#7a2a20}
.note{color:var(--dim);font-size:12px}
.foot{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.keyrow{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #1d2229;font-size:13px}
.keybtn{min-width:110px;background:#0f1216;border:1px solid var(--line);padding:4px 10px;border-radius:4px;font-size:12px}
.keybtn.wait{border-color:var(--ember);color:var(--ember)}
.tabs{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(5,6,8,.72);backdrop-filter:blur(3px)}
#loading{z-index:60;background:#0a0c0f;flex-direction:column;gap:16px}
.spin{width:44px;height:44px;border:4px solid #2a2f37;border-top-color:var(--ember);border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#clickplay{z-index:25;background:rgba(0,0,0,.35);cursor:pointer;font-size:20px;letter-spacing:.3em;text-transform:uppercase;text-shadow:0 2px 8px #000}
.pausebox{width:min(420px,92vw);display:flex;flex-direction:column;gap:10px;align-items:stretch}
.pausebox .btn{width:100%}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.6)}
#cross.act{background:var(--ember2);width:10px;height:10px;margin:-5px}
#hitm{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;opacity:0;transition:opacity .15s}
#hitm::before,#hitm::after{content:"";position:absolute;left:12px;top:0;width:2px;height:26px;background:#fff;transform:rotate(45deg)}#hitm::after{transform:rotate(-45deg)}
#hitm.on{opacity:1;transition:none}
#stats{position:absolute;left:16px;bottom:16px;display:flex;flex-direction:column;gap:5px;width:196px}
.bar{position:relative;height:15px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;width:100%;transition:width .15s}
.bar>span{position:absolute;left:6px;top:0;font-size:10px;line-height:14px;letter-spacing:.1em;text-shadow:0 1px 2px #000;font-weight:700}
.bar>b{position:absolute;right:6px;top:0;font-size:10px;line-height:14px;text-shadow:0 1px 2px #000}
#hotbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px}
.hs{position:relative;width:54px;height:54px;background:rgba(10,12,15,.66);border:2px solid rgba(255,255,255,.14);border-radius:6px;display:flex;align-items:center;justify-content:center}
.hs.sel{border-color:var(--ember2);background:rgba(60,34,18,.75);box-shadow:0 0 12px rgba(255,150,60,.4)}
.hs .k{position:absolute;left:4px;top:1px;font-size:10px;color:#aab}
.hs .ic{font-size:27px;filter:drop-shadow(0 2px 2px #000)}
.hs .n{position:absolute;right:4px;bottom:1px;font-size:12px;font-weight:700;text-shadow:0 1px 2px #000}
#selname{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);font-size:13px;letter-spacing:.12em;text-shadow:0 1px 4px #000;transition:opacity .4s}
#prompt{position:absolute;left:50%;top:57%;transform:translateX(-50%);font-size:15px;background:rgba(0,0,0,.5);padding:5px 12px;border-radius:5px;text-shadow:0 1px 3px #000;white-space:nowrap}
#buildbar{position:absolute;left:50%;bottom:98px;transform:translateX(-50%);background:rgba(10,12,15,.8);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:340px}
#buildbar .pcs{display:flex;gap:4px}
.pc{width:40px;height:38px;border:1px solid var(--line);border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;opacity:.6}
.pc small{font-size:8px;letter-spacing:.05em;text-transform:uppercase}
.pc.sel{border-color:var(--ember2);opacity:1;background:rgba(80,44,20,.7)}
#toasts{position:absolute;left:16px;top:16px;display:flex;flex-direction:column;gap:4px;max-width:430px}
.toast{background:rgba(10,12,15,.78);border-left:3px solid var(--ember);padding:6px 12px;font-size:13px;border-radius:3px;animation:tin .25s;text-shadow:0 1px 2px #000}
.toast.warn{border-color:var(--bad)}.toast.good{border-color:var(--good)}
@keyframes tin{from{transform:translateX(-14px);opacity:0}}
#objective{position:absolute;right:16px;top:66px;max-width:280px;background:rgba(10,12,15,.6);border-right:3px solid var(--ember);padding:8px 12px;font-size:12px;text-align:right;border-radius:3px}
#objective b{display:block;color:var(--ember2);font-size:10px;letter-spacing:.2em;margin-bottom:2px}
#objective em{display:block;font-style:normal;color:var(--dim);margin-top:3px}
#clock{position:absolute;right:16px;top:14px;text-align:right;font-size:13px;background:rgba(10,12,15,.6);padding:8px 12px;border-radius:5px;line-height:1.4}
#fps{position:absolute;left:50%;top:8px;transform:translateX(-50%);font-size:11px;color:#9f9;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:3px}
#floaters{position:absolute;left:50%;top:44%;transform:translateX(-50%);text-align:center}
.fl{font-size:14px;font-weight:700;color:var(--ember2);text-shadow:0 1px 3px #000;animation:fl 1.1s forwards}
@keyframes fl{to{transform:translateY(-34px);opacity:0}}
#hurt{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(200,0,0,.55) 100%);opacity:0;transition:opacity .35s}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.4) 100%);mix-blend-mode:multiply}
#under{position:absolute;inset:0;background:rgba(20,80,130,.45)}
#saveic{position:absolute;right:16px;bottom:16px;font-size:12px;color:var(--dim);opacity:0;transition:opacity .4s}
#modebadge{position:absolute;left:16px;bottom:150px;font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--dim)}
/* ---------- inventory ---------- */
#invov{align-items:center;overflow:auto}
#inv{display:flex;gap:16px;width:min(1180px,98vw);max-height:96vh;overflow:auto;padding:4px}
.pnl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.pnl h3{margin:0 0 8px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ember2)}
.sgrid{display:grid;grid-template-columns:repeat(9,52px);gap:4px}
.sgrid.c6{grid-template-columns:repeat(6,52px)}
.sl{position:relative;width:52px;height:52px;background:#0f1216;border:1px solid #2b323b;border-radius:5px;display:flex;align-items:center;justify-content:center}
.sl.hot{border-color:#5a4028}.sl:hover{border-color:var(--ember2);background:#1a1712}
.sl.sel{box-shadow:inset 0 0 0 2px var(--ember)}
.sl .ic{font-size:26px;pointer-events:none}.sl .n{position:absolute;right:3px;bottom:0;font-size:11px;font-weight:700;text-shadow:0 1px 2px #000;pointer-events:none}
.sl .t{position:absolute;left:3px;top:0;font-size:9px;color:#778;pointer-events:none}
.sl .lab{position:absolute;inset:auto 0 0 0;font-size:8px;color:#556;text-align:center;pointer-events:none;letter-spacing:.1em}
#ghost{position:fixed;z-index:80;pointer-events:none;width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:-26px 0 0 -26px;background:rgba(30,25,20,.85);border:1px solid var(--ember2);border-radius:5px}
#ghost .n{position:absolute;right:3px;bottom:0;font-size:11px;font-weight:700}
#tip{position:fixed;z-index:90;pointer-events:none;background:#0b0d10;border:1px solid var(--ember);padding:8px 11px;border-radius:6px;max-width:260px;font-size:12px;line-height:1.45}
#tip b{color:var(--ember2);font-size:14px}#tip .d{color:var(--dim)}#tip .s{color:#b6e0a0}
.rc{display:flex;gap:9px;align-items:center;padding:6px 8px;border:1px solid #232a32;border-radius:6px;margin-bottom:4px;background:#0f1216}
.rc.no{opacity:.5}.rc.lock{opacity:.35}
.rc .ic{font-size:24px;width:32px;text-align:center}.rc .info{flex:1;min-width:0}.rc .nm{font-size:13px;font-weight:700}
.ing{display:inline-block;font-size:11px;margin:2px 8px 0 0;color:var(--good)}.ing.miss{color:var(--bad)}
#craftlist{max-height:52vh;overflow:auto;padding-right:4px}
.eq{display:flex;gap:4px;margin-bottom:10px;align-items:center}
.prog li{margin:5px 0;font-size:13px}.prog li.d{color:var(--good)}.prog li small{display:block;color:var(--dim);font-size:11px}
.tier{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0;font-size:12px}.tier.on{border-color:#4a6a3a}.tier b{color:var(--ember2)}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#3a424d;border-radius:4px}
@media(max-width:1000px){#inv{flex-direction:column}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud" class="hidden">
  <div id="under" class="hidden"></div><div id="vig"></div><div id="hurt"></div>
  <div id="cross"></div><div id="hitm"></div><div id="floaters"></div>
  <div id="toasts"></div><div id="clock"></div><div id="objective"></div><div id="fps" class="hidden"></div>
  <div id="prompt" class="hidden"></div><div id="buildbar" class="hidden"></div>
  <div id="selname"></div><div id="hotbar"></div><div id="stats"></div><div id="modebadge"></div><div id="saveic">Saving…</div>
</div>
<div id="menus"><canvas id="bgc"></canvas></div>
<div id="clickplay" class="ov hidden">Click to resume</div>
<div id="tip" class="hidden"></div><div id="ghost" class="hidden"></div>
<div id="loading" class="ov hidden"><div class="spin"></div><div id="loadtxt" style="letter-spacing:.2em;text-transform:uppercase;font-size:13px">Loading…</div></div>
<script>

      <div>${Object.entries(r.ing).map(([k,v])=>{ const have=g.inv.count(k); return `<span class="ing ${have>=v||g.creative?'':'miss'}">${A.ITEMS[k].icon} ${A.ITEMS[k].name} ${g.creative?v:have+'/'+v}</span>`; }).join('')}</div></div>
      <button class="btn sm" data-craft="${idx}" ${c.ok?'':'disabled'}>Craft</button></div>`; });
  return h+'</div>'; };
ui.progressHtml=function(){
  const g=A.game; let h='<h3>Objectives</h3><ul class="prog" style="padding-left:18px;margin:0;max-height:26vh;overflow:auto">';
  for(const o of A.OBJECTIVES){ if(o.req==='hostile'&&!g.mobs.hostileAllowed())continue; const d=g.done[o.id]; h+=`<li class="${d?'d':''}">${d?'✔':'○'} ${esc(o.t)}${d?'':`<small>${esc(o.tip)}</small>`}</li>`; }
  h+='</ul><h3 style="margin-top:12px">Technology</h3>';
  for(let l=1;l<=3;l++){ const rs=A.RECIPES.filter(r=>r.st===l).map(r=>A.ITEMS[r.out].icon+' '+A.ITEMS[r.out].name); const on=g.techLevel>=l||g.creative;
    h+=`<div class="tier ${on?'on':''}"><b>Tier ${l} · ${A.STATION_NAMES[l]}</b> ${on?'✔ unlocked':'🔒'}<br><span class="note">${l===1?'Available anywhere.':l===2?'Build a Workbench. Unlocks stone/metal building tiers.':'Build an Advanced Workbench (scrap + metal). Unlocks Advanced tier.'}</span><div class="note" style="margin-top:3px">${rs.join(' · ')}</div></div>`; }
  return h; };
ui.itemsHtml=function(){ return `<div class="note" style="margin-bottom:6px">Click an item to pick up a full stack. Drop it on this palette to delete it.</div><div class="sgrid" style="grid-template-columns:repeat(6,52px);max-height:56vh;overflow:auto" id="palette">${Object.values(A.ITEMS).filter(i=>i.id!=='backpack').map(i=>`<div class="sl" data-pal="${i.id}"><span class="ic">${i.icon}</span></div>`).join('')}</div>`; };
// ---------- drag & drop ----------
function accepts(inv,i,st){ if(inv!=='equip')return true; const d=A.ITEMS[st.id]; return d.armor&&d.armor.slot===SLOTS[i]; }
ui.setGhost=function(){ const gh=$('ghost'); if(!ui.held){ gh.classList.add('hidden'); return; } const d=A.ITEMS[ui.held.id]; gh.classList.remove('hidden'); gh.innerHTML=`${d.icon}${ui.held.n>1?`<span class="n">${ui.held.n}</span>`:''}`; };
addEventListener('mousemove',e=>{ const gh=$('ghost'); if(ui.held){ gh.style.left=e.clientX+'px'; gh.style.top=e.clientY+'px'; } const tip=$('tip'); if(!tip.classList.contains('hidden')){ tip.style.left=Math.min(innerWidth-280,e.clientX+16)+'px'; tip.style.top=Math.min(innerHeight-140,e.clientY+12)+'px'; } });
ui.hideTip=function(){ $('tip').classList.add('hidden'); };
function tipFor(id){ const d=A.ITEMS[id]; let s=''; const t=d.tool; if(t){ s+=`Damage ${t.dmg}`; if(t.g&&Object.keys(t.g).length)s+=' · Gather '+Object.entries(t.g).map(([k,v])=>k+' '+v).join(', '); } if(d.ranged)s+=`Damage ${d.dmg} · ranged`; if(d.armor)s+=`Armor ${Math.round(d.armor.def*100)}% · Warmth ${d.armor.ins}`; if(d.food)s+=Object.entries(d.food).map(([k,v])=>`${v>0?'+':''}${v} ${k}`).join(' · ');
  return `<b>${d.icon} ${d.name}</b><div class="d">${d.desc||''}</div>${s?`<div class="s">${s}</div>`:''}<div class="d" style="font-size:10px">Stack ${d.stack}</div>`; }
ui.bindInv=function(root){
  const g=A.game;
  root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ ui.tab=b.dataset.tab; ui.renderInv(); });
  root.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ ui.cat=b.dataset.cat; ui.renderInv(); });
  root.querySelectorAll('[data-craft]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const r=A.RECIPES[+b.dataset.craft]; const n=e.shiftKey?5:1; for(let i=0;i<n;i++) if(!g.craft(r))break; ui.renderInv(); });
  root.querySelectorAll('.rc').forEach(r=>{ const rec=A.RECIPES[+r.dataset.r]; r.onmouseenter=e=>{ const t=$('tip'); t.innerHTML=tipFor(rec.out); t.classList.remove('hidden'); }; r.onmouseleave=ui.hideTip; });
  root.querySelectorAll('[data-pal]').forEach(p=>{ p.onmousedown=e=>{ if(ui.held)return; const id=p.dataset.pal; ui.held={id,n:A.ITEMS[id].stack>1?Math.min(A.ITEMS[id].stack,e.button===2?1:A.ITEMS[id].stack):1,from:{pal:1}}; ui.setGhost(); }; p.onmouseenter=()=>{ const t=$('tip'); t.innerHTML=tipFor(p.dataset.pal); t.classList.remove('hidden'); }; p.onmouseleave=ui.hideTip; });
  const pal=root.querySelector('#palette'); if(pal) pal.addEventListener('mousedown',e=>{ if(ui.held&&!e.target.closest('[data-pal]')){ ui.held=null; ui.setGhost(); } });
  root.querySelectorAll('.sl[data-inv]').forEach(s=>{
    const inv=s.dataset.inv, i=+s.dataset.i;
    s.onmouseenter=()=>{ ui.hover={inv,i}; const st=ui.getInv(inv)[i]; if(st&&!ui.held){ const t=$('tip'); t.innerHTML=tipFor(st.id); t.classList.remove('hidden'); } };
    s.onmouseleave=()=>{ ui.hover=null; ui.hideTip(); };
    s.onmousedown=e=>{ e.preventDefault(); e.stopPropagation(); ui.hideTip(); ui.slotDown(inv,i,e); };
    s.onmouseup=e=>{ ui.slotUp(inv,i,e); };
    s.ondblclick=e=>{ const st=ui.getInv(inv)[i]; if(st&&A.ITEMS[st.id].armor&&inv!=='equip'){ ui.quickMove(inv,i,true); } };
  });
};
ui.slotDown=function(inv,i,e){
  const g=A.game, arr=ui.getInv(inv), st=arr[i]; ui.pressed={inv,i,held:!!ui.held};
  if(e.shiftKey&&!ui.held&&st){ ui.quickMove(inv,i); return; }
  if(e.button===2){
    if(!ui.held){ if(st){ const take=Math.ceil(st.n/2); ui.held={id:st.id,n:take,from:{inv,i}}; st.n-=take; if(st.n<=0)arr[i]=null; } }
    else { if(!accepts(inv,i,ui.held))return; if(!st){ arr[i]={id:ui.held.id,n:1}; ui.held.n--; } else if(st.id===ui.held.id&&st.n<A.ITEMS[st.id].stack){ st.n++; ui.held.n--; } if(ui.held.n<=0)ui.held=null; }
  } else {
    if(!ui.held){ if(st){ ui.held={id:st.id,n:st.n,from:{inv,i}}; arr[i]=null; ui.pressed.picked=true; } }
    else { if(!accepts(inv,i,ui.held)){ g.toast('That does not fit here.',1); return; } if(!st){ arr[i]=ui.held; ui.held=null; } else if(st.id===ui.held.id){ const room=A.ITEMS[st.id].stack-st.n, t=Math.min(room,ui.held.n); st.n+=t; ui.held.n-=t; if(ui.held.n<=0)ui.held=null; } else { const o=arr[i]; arr[i]=ui.held; ui.held=o; ui.held.from={inv,i}; } }
  }
  ui.afterMove(); };
ui.slotUp=function(inv,i,e){ const p=ui.pressed; if(!p||!p.picked||!ui.held||e.button!==0)return; ui.pressed=null; const f=ui.held.from; if(f&&f.inv===inv&&f.i===i)return; // click mode
  const arr=ui.getInv(inv), st=arr[i]; if(!accepts(inv,i,ui.held))return; if(!st){ arr[i]=ui.held; ui.held=null; } else if(st.id===ui.held.id){ const t=Math.min(A.ITEMS[st.id].stack-st.n,ui.held.n); st.n+=t; ui.held.n-=t; if(ui.held.n<=0)ui.held=null; } else { const o=arr[i]; arr[i]=ui.held; ui.held=o; }
  ui.afterMove(); };
ui.quickMove=function(inv,i,equipOnly){
  const g=A.game, arr=ui.getInv(inv), st=arr[i]; if(!st)return; const d=A.ITEMS[st.id];
  if(d.armor&&inv!=='equip'){ const idx=SLOTS.indexOf(d.armor.slot); const old=g.equip.slots[idx]; g.equip.slots[idx]={id:st.id,n:1}; st.n--; if(st.n<=0)arr[i]=old; else if(old)g.inv.add(old.id,old.n); g.equipDirty=true; A.audio.play('craft',.6); ui.afterMove(); return; }
  if(equipOnly)return;
  let left=st.n;
  if(inv==='equip'){ left=g.inv.add(st.id,st.n); }
  else if(ui.cont&&inv==='main'){ const tmp=new A.Inventory(1); tmp.slots=ui.cont.inv.slots; left=tmp.add(st.id,st.n); }
  else if(ui.cont&&inv==='cont'){ left=g.inv.add(st.id,st.n,9,36); if(left>0)left=g.inv.add(st.id,left,0,9); }
  else if(inv==='main'){ left=i<9?g.inv.add(st.id,st.n,9,36):g.inv.add(st.id,st.n,0,9); }
  if(left<=0)arr[i]=null; else st.n=left; A.audio.play('click',.5); ui.afterMove(); };
ui.afterMove=function(){ const g=A.game; g.equipDirty=true; if(ui.cont&&ui.cont.ct) ui.cont.ct.slots=ui.cont.inv.slots; ui.setGhost(); ui.renderInv(); g.setViewmodel&&g.setViewmodel(); A.audio.play('click',.35); };
ui.returnHeld=function(){ const g=A.game, h=ui.held; if(!h)return; ui.held=null; if(h.from&&h.from.pal){ ui.setGhost(); return; } const left=g.inv.add(h.id,h.n); if(left>0){ const p=g.player.pos; g.dropItem(h.id,left,p.x,p.y+1.2,p.z,true); } ui.setGhost(); };
ui.dropHeld=function(){ const g=A.game, h=ui.held; if(!h)return; ui.held=null; ui.setGhost(); if(h.from&&h.from.pal)return; const p=g.player.pos, d=g.look(new THREE.Vector3()); g.dropItem(h.id,h.n,p.x+d.x*1.2,p.y+1.3,p.z+d.z*1.2); A.audio.play('click',.6); };
addEventListener('keydown',e=>{ if(e.code==='KeyG'&&ui.open&&ui.hover&&!ui.held){ const arr=ui.getInv(ui.hover.inv), st=arr[ui.hover.i]; if(st){ const n=e.shiftKey?st.n:1; const g=A.game,p=g.player.pos,d=g.look(new THREE.Vector3()); g.dropItem(st.id,n,p.x+d.x*1.2,p.y+1.3,p.z+d.z*1.2); st.n-=n; if(st.n<=0)arr[ui.hover.i]=null; ui.afterMove(); } } });
// ---------- creative menu ----------
ui.openCreative=function(){ const g=A.game; g.uiOpen=true; ui.unlock(); ui.open=false; const mobs=Object.entries(A.MOB_DEF);
  const ov=el(`<div class="ov" id="crov"><div class="card" style="width:min(640px,94vw)"><h2 class="st">Creative Menu</h2>
   <h4>Spawn creature (at your crosshair)</h4><div class="chips">${mobs.map(([k,d])=>`<button class="chip" data-mob="${k}" style="cursor:pointer">${d.hostile?'☠ ':'🐾 '}${d.name}</button>`).join('')}</div>
   <h4>Time of day</h4><div class="chips">${[['Dawn',.27],['Noon',.5],['Dusk',.74],['Midnight',.98]].map(([n,t])=>`<button class="chip" data-tod="${t}" style="cursor:pointer">${n}</button>`).join('')}</div>
   <h4>Weather</h4><div class="chips">${['clear','cloudy','rain','storm'].map(w=>`<button class="chip" data-w="${w}" style="cursor:pointer">${w}</button>`).join('')}</div>
   <h4>Tools</h4><div class="note">Double-tap SPACE: toggle flight · SPACE up / CTRL down · X: remove object you look at (pieces, deployables, nodes, mobs) · Building is free and instant (hold LMB) · All recipes and building tiers unlocked · Open the inventory (TAB) → Creative Items for every item.</div>
   <div class="foot" style="margin-top:14px"><button class="btn" id="crClose">Close (V)</button></div></div></div>`);
  document.body.appendChild(ov);
  ov.querySelectorAll('[data-mob]').forEach(b=>b.onclick=()=>g.spawnMob(b.dataset.mob));
  ov.querySelectorAll('[data-tod]').forEach(b=>b.onclick=()=>{ g.sky.tod=+b.dataset.tod; });
  ov.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{ g.sky.weather=b.dataset.w; g.sky.wt=300; });
  ov.querySelector('#crClose').onclick=()=>ui.closePanels(); };
})();

</script><script>
// ASHFALL :: main — menus (main, worlds, new world, settings, credits) and bootstrap
(function(){

  creative:{mode:'creative',difficulty:'normal',hostile:false,passive:true,zombies:false,abundance:'high',respawn:true,hunger:false,thirst:false,temperature:false,fallDamage:false,playerDamage:false,dayNight:true,dayLength:'normal',lootAbundance:'high',enemyDifficulty:'normal',startItems:'generous',friendlyFire:false}
};

(function(){ const c=$('bgc'),x=c.getContext('2d'); let W,H,ps=[]; const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight;}; rs(); addEventListener('resize',rs);

 <div class="mainbtns"><button class="btn big" id="mPlay">Play</button><button class="btn big" id="mCont">Continue</button><button class="btn big" id="mNew">New World</button><button class="btn big" id="mSet">Settings</button><button class="btn big" id="mCred">Credits</button></div>
 <div class="note" style="text-align:center;margin-top:20px">Single-player · runs entirely in your browser · worlds saved locally</div>`);

// ---------- new world ----------
const opt=(id,label,vals,cur)=>`<div class="row"><label>${label}</label><select id="${id}">${vals.map(([v,t])=>`<option value="${v}" ${v===cur?'selected':''}>${t}</option>`).join('')}</select></div>`;

M.renderNew=function(){
  const b=$('nwbody'), c=nw, pe=c.mode==='peaceful';
  b.innerHTML=`<div class="tabs">${['default','hardcore','peaceful','creative','custom'].map(p=>`<span class="chip ${c.preset===p?'on':''}" data-preset="${p}" style="cursor:pointer">${p}</span>`).join('')}</div>

  <h4>Survival</h4><div class="grid2">${chk('hunger','Hunger',c.hunger)}${chk('thirst','Thirst',c.thirst)}${chk('temperature','Temperature',c.temperature)}${chk('fallDamage','Fall damage',c.fallDamage)}${chk('playerDamage','Player damage (from mobs)',c.playerDamage)}</div>
  <h4>Day / Night</h4><div class="grid2">${chk('dayNight','Day/night cycle',c.dayNight)}</div>${opt('dayLength','Day length',[['short','Short (8 min)'],['normal','Normal (20 min)'],['long','Long (40 min)']],c.dayLength)}
  <h4>Other</h4>${opt('lootAbundance','Loot abundance',[['low','Low'],['normal','Normal'],['high','High']],c.lootAbundance)}${opt('enemyDifficulty','Enemy difficulty',[['weak','Weak'],['normal','Normal'],['tough','Tough'],['nightmare','Nightmare']],c.enemyDifficulty)}
  ${opt('startItems','Starting items',[['none','None'],['basic','Basic'],['generous','Generous']],c.startItems)}<div class="grid2">${chk('friendlyFire','Friendly fire (reserved for future multiplayer)',c.friendlyFire)}</div>`;
  b.querySelectorAll('[data-preset]').forEach(x=>x.onclick=()=>{ const p=x.dataset.preset; if(p!=='custom'){ const keep={name:c.name,seed:c.seed,size:c.size}; Object.assign(nw,PRESETS[p],keep); } nw.preset=p; M.renderNew(); });
  $('nRand').onclick=()=>{ nw.seed=randSeed(); $('nSeed').value=nw.seed; };
  const bindV=(id,key,isChk)=>{ const e=$(id); if(!e)return; e.onchange=()=>{ nw[key]=isChk?e.checked:e.value; if(key==='mode'){ if(nw.mode==='peaceful'){nw.hostile=false;nw.zombies=false;} if(nw.mode==='creative'){nw.hunger=nw.thirst=nw.temperature=nw.fallDamage=nw.playerDamage=false;nw.startItems='generous';nw.hostile=false;nw.zombies=false;} }
      if(!['name','seed','size'].includes(key)||false){ if(nw.preset!=='custom'&&key!=='mode'){ nw.preset='custom'; } } M.renderNew(); }; };
  [['nDiff','difficulty'],['nMode','mode'],['nSize','size'],['abundance','abundance'],['dayLength','dayLength'],['lootAbundance','lootAbundance'],['enemyDifficulty','enemyDifficulty'],['startItems','startItems']].forEach(([i,k])=>bindV(i,k));
  ['hostile','zombies','passive','respawn','hunger','thirst','temperature','fallDamage','playerDamage','dayNight','friendlyFire'].forEach(k=>bindV(k,k,true));
  $('nName').oninput=e=>nw.name=e.target.value; $('nSeed').oninput=e=>nw.seed=e.target.value;
  if(pe){ $('hostile').disabled=true; $('zombies').disabled=true; }
};
$('nwCreate').onclick=async()=>{
  const c=nw; if(!c)return; const s=Object.assign({},c); s.name=(c.name||'ASHFALL').trim()||'ASHFALL'; s.seed=(c.seed||randSeed()).trim()||randSeed(); delete s.preset;
  if(s.mode==='peaceful'){ s.hostile=false; s.zombies=false; }
  const meta={id:'w'+Date.now().toString(36),name:s.name,settings:s,createdAt:Date.now(),lastPlayed:Date.now(),playTime:0,day:1};
  M.launch({meta,data:null}); };
// ---------- settings ----------
const slider=(id,l,min,max,step,v)=>`<div class="row"><label>${l}</label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${v}"><span class="note" id="${id}v">${v}</span></div>`;
M.fillSettings=function(box,overlay){
  const s=A.settings, g=s.gfx;
  const sel=(id,l,vals,cur)=>opt(id,l,vals.map((t,i)=>[String(i),t]),String(cur));
  box.innerHTML=`<h4>Graphics</h4>${opt('sQ','Quality preset',[['low','Low'],['medium','Medium'],['high','High'],['ultra','Ultra']].concat(s.quality==='custom'?[['custom','Custom']]:[]),s.quality)}
   ${slider('sDist','Render distance (m)',60,400,10,g.dist)}${sel('sSh','Shadow quality',['Off','Low','Medium','High'],g.shadow)}${sel('sTex','Texture quality',['Low','Medium','High','Ultra'],g.tex)}${sel('sFx','Effects (dynamic lights)',['Minimal','Standard','Full'],g.fx)}${sel('sPa','Particles',['Few','Normal','Many'],g.particles)}
   <div class="grid2">${chk('sPost','Post-processing (vignette)',g.post)}${chk('sAo','Ambient occlusion (baked)',g.ao)}${chk('sAa','Anti-aliasing (applies on world load)',g.aa)}${chk('sFps','Show FPS counter',s.fps)}</div>
   ${slider('sRes','Resolution scale',.5,1,.05,g.res)}${slider('sFov','Field of view',60,110,1,s.fov)}${slider('sSens','Mouse sensitivity',.2,3,.1,s.sens)}
   <h4>Audio</h4>${slider('sMaster','Master volume',0,1,.05,s.master)}${slider('sSfx','Effects volume',0,1,.05,s.sfx)}${slider('sAmb','Ambient volume',0,1,.05,s.amb)}
   <h4>Controls (click a key to rebind)</h4><div id="keys"></div><div class="row"><button class="btn sm" id="sKeyReset">Reset controls</button></div>
   <div class="note" style="margin-top:8px">Fixed: Left mouse attack/gather · Right mouse alternate (block / cancel / demolish) · 1-9 hotbar · ESC menu</div>`;
  const apply=()=>{ A.storeSettings(); A.audio.applyVolume(); const gm=A.game; if(gm&&gm.playing)gm.applyGraphics(); const h=$('fps'); if(h)h.classList.toggle('hidden',!s.fps); const v=$('vig'); if(v)v.style.display=g.post?'block':'none'; };
  const bindN=(id,f)=>{ const e=box.querySelector('#'+id); e.oninput=e.onchange=()=>{ f(e); const lab=box.querySelector('#'+id+'v'); if(lab)lab.textContent=e.value; }; };
  const custom=()=>{ s.quality='custom'; const q=box.querySelector('#sQ'); if(![...q.options].some(o=>o.value==='custom'))q.add(new Option('Custom','custom')); q.value='custom'; };
  box.querySelector('#sQ').onchange=e=>{ if(e.target.value==='custom')return; s.quality=e.target.value; s.gfx=Object.assign({},A.GFX_PRESETS[s.quality]); apply(); M.fillSettings(box,overlay); };
  bindN('sDist',e=>{g.dist=+e.value;custom();apply();}); bindN('sSh',e=>{g.shadow=+e.value;custom();apply();}); bindN('sTex',e=>{g.tex=+e.value;custom();apply();}); bindN('sFx',e=>{g.fx=+e.value;custom();apply();}); bindN('sPa',e=>{g.particles=+e.value;custom();apply();});
  bindN('sPost',e=>{g.post=e.checked;custom();apply();}); bindN('sAo',e=>{g.ao=e.checked;custom();apply();}); bindN('sAa',e=>{g.aa=e.checked;custom();apply();}); bindN('sFps',e=>{s.fps=e.checked;apply();});
  bindN('sRes',e=>{g.res=+e.value;custom();apply();}); bindN('sFov',e=>{s.fov=+e.value;apply();const gm=A.game;if(gm&&gm.camera)gm.camera.fov=s.fov;}); bindN('sSens',e=>{s.sens=+e.value;apply();});
  bindN('sMaster',e=>{s.master=+e.value;apply();}); bindN('sSfx',e=>{s.sfx=+e.value;apply();}); bindN('sAmb',e=>{s.amb=+e.value;apply();});
  const kb=box.querySelector('#keys'); const drawKeys=()=>{ kb.innerHTML=Object.keys(A.KEY_LABELS).map(a=>`<div class="keyrow"><span>${A.KEY_LABELS[a]}</span><button class="keybtn" data-a="${a}">${s.keys[a].map(k=>k.replace('Key','').replace('Left','L').replace('Right','R')).join(' / ')}</button></div>`).join('');
    kb.querySelectorAll('.keybtn').forEach(b=>b.onclick=()=>{ b.classList.add('wait'); b.textContent='press a key…'; A.rebinding=e=>{ A.rebinding=null; if(e.code!=='Escape'){ s.keys[b.dataset.a]=[e.code]; A.storeSettings(); } drawKeys(); }; }); }; drawKeys();
  box.querySelector('#sKeyReset').onclick=()=>{ s.keys=JSON.parse(JSON.stringify(A.defaultKeys)); A.storeSettings(); drawKeys(); };
};
M.showSettings=function(fromPause){ const ov=document.createElement('div'); ov.className='ov'; ov.style.zIndex=50; ov.innerHTML='<div class="card" style="width:min(760px,95vw);max-height:92vh"><h2 class="st">Settings</h2><div class="sbody"></div><div class="foot" style="margin-top:12px"><button class="btn">Close</button></div></div>'; document.body.appendChild(ov);
  M.fillSettings(ov.querySelector('.sbody'),true); ov.querySelector('.btn').onclick=()=>ov.remove(); };
// ---------- boot ----------
A.game=new A.Game();
M.show('main'); M.refreshMain();
if(A.DEBUG) window.ASH={A};
})();

</script>
</body>
