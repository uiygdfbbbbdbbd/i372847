<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: radial-gradient(circle at 30% 20%, #1b2740, #07090f 70%);
    color: #e6e8ec;
    overflow: hidden;
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 16px;
  }
  header {
    display: flex; gap: 24px; align-items: baseline;
    font-variant-numeric: tabular-nums;
  }
  h1 {
    margin: 0; font-size: 1.4rem; letter-spacing: .18em;
    color: #7ee787; text-transform: uppercase;
  }
  .stat { font-size: .95rem; color: #b6bcc8; }
  .stat b { color: #fff; }
  canvas {
    background: #0b0f18;
    border-radius: 14px;
    box-shadow: 0 20px 60px #0008, 0 0 0 1px #1a2030 inset;
    max-width: 92vmin; max-height: 92vmin;
    width: 480px; height: 480px;
    touch-action: none;
  }
  .hint { font-size: .8rem; color: #6b7180; }
  .overlay {
    position: fixed; inset: 0;
    background: #000a;
    display: none;
    align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .overlay.on { display: flex; }
  .card {
    background: #131826;
    border: 1px solid #263049;
    border-radius: 14px;
    padding: 24px 28px;
    text-align: center;
    min-width: 240px;
  }
  .card h2 { margin: 0 0 6px; font-size: 1.2rem; }
  .card p  { margin: 4px 0; color: #b6bcc8; font-size: .9rem; }
  button {
    margin-top: 14px; font: inherit; font-weight: 600;
    padding: 10px 18px; border-radius: 8px;
    border: 1px solid #7ee78755; background: #14251a; color: #7ee787;
    cursor: pointer;
  }
  button:hover { background: #1a3524; }
</style>
</head>
<body>
  <header>
    <h1>Snake</h1>
    <div class="stat">Score <b id="score">0</b></div>
    <div class="stat">Best <b id="best">0</b></div>
  </header>
  <canvas id="c" width="480" height="480"></canvas>
  <div class="hint">Arrow keys / WASD - Space to pause - Swipe on mobile</div>

  <div class="overlay on" id="ov">
    <div class="card">
      <h2 id="ovTitle">Ready?</h2>
      <p id="ovMsg">Eat the apples. Do not eat yourself.</p>
      <button id="startBtn">Play</button>
    </div>
  </div>

<script>
(function(){
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl  = document.getElementById('best');
  var ov = document.getElementById('ov');
  var ovTitle = document.getElementById('ovTitle');
  var ovMsg = document.getElementById('ovMsg');
  var startBtn = document.getElementById('startBtn');

  var GRID = 20;
  var CELL = canvas.width / GRID;
  var snake, dir, nextDir, food, score, best, tickMs, alive, paused, timer;

  try { best = +localStorage.getItem('snake_best') || 0; } catch(e){ best = 0; }
  bestEl.textContent = best;

  function reset(){
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0}; nextDir = dir;
    score = 0; scoreEl.textContent = 0;
    tickMs = 110;
    alive = true; paused = false;
    placeFood();
  }

  function placeFood(){
    while(true){
      var f = { x: (Math.random()*GRID)|0, y: (Math.random()*GRID)|0 };
      var hit = false;
      for(var i=0;i<snake.length;i++) if(snake[i].x===f.x && snake[i].y===f.y){ hit=true; break; }
      if(!hit){ food = f; return; }
    }
  }

  function step(){
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if(head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) return die();
    for(var i=0;i<snake.length;i++) if(snake[i].x===head.x && snake[i].y===head.y) return die();

    snake.unshift(head);
    if(head.x === food.x && head.y === food.y){
      score++; scoreEl.textContent = score;
      if(score > best){
        best = score; bestEl.textContent = best;
        try { localStorage.setItem('snake_best', best); } catch(e){}
      }
      tickMs = Math.max(55, tickMs - 2);
      placeFood();
    } else {
      snake.pop();
    }
    draw();
    if(alive && !paused) timer = setTimeout(step, tickMs);
  }

  function draw(){
    ctx.fillStyle = '#0b0f18';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = '#131a29';
    ctx.lineWidth = 1;
    for(var i=1;i<GRID;i++){
      ctx.beginPath();
      ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,canvas.height); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0,i*CELL); ctx.lineTo(canvas.width,i*CELL); ctx.stroke();
    }
    var fx = food.x*CELL + CELL/2, fy = food.y*CELL + CELL/2;
    var grad = ctx.createRadialGradient(fx,fy,1,fx,fy,CELL/2);
    grad.addColorStop(0, '#ff6b6b'); grad.addColorStop(1, '#8b1a1a');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(fx, fy, CELL/2 - 2, 0, Math.PI*2); ctx.fill();

    for(var j=snake.length-1; j>=0; j--){
      var s = snake[j];
      var t = j / snake.length;
      ctx.fillStyle = j===0 ? '#7ee787' : 'hsl(' + (140 - t*30) + ', ' + (60 - t*20) + '%, ' + (55 - t*20) + '%)';
      var pad = j===0 ? 1 : 2;
      roundRect(s.x*CELL+pad, s.y*CELL+pad, CELL-pad*2, CELL-pad*2, 5);
      ctx.fill();
    }
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function die(){
    alive = false;
    clearTimeout(timer);
    ovTitle.textContent = 'Game Over';
    ovMsg.textContent = 'You scored ' + score + '.';
    startBtn.textContent = 'Play again';
    ov.classList.add('on');
  }

  function start(){
    reset();
    ov.classList.remove('on');
    clearTimeout(timer);
    timer = setTimeout(step, tickMs);
  }

  function togglePause(){
    if(!alive) return;
    paused = !paused;
    if(paused){
      clearTimeout(timer);
      ovTitle.textContent = 'Paused';
      ovMsg.textContent = 'Press space to resume.';
      startBtn.textContent = 'Resume';
      ov.classList.add('on');
    } else {
      ov.classList.remove('on');
      timer = setTimeout(step, tickMs);
    }
  }

  var KEYS = {
    ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
    w:[0,-1], s:[0,1], a:[-1,0], d:[1,0],
    W:[0,-1], S:[0,1], A:[-1,0], D:[1,0]
  };

  addEventListener('keydown', function(e){
    if(e.key === ' '){ e.preventDefault(); togglePause(); return; }
    if(!alive){ if(e.key==='Enter') start(); return; }
    var k = KEYS[e.key];
    if(!k) return;
    var x = k[0], y = k[1];
    if(x === -dir.x && y === -dir.y) return;
    nextDir = {x:x,y:y};
  });

  startBtn.addEventListener('click', function(){ paused ? togglePause() : start(); });

  var touchStart = null;
  canvas.addEventListener('touchstart', function(e){
    var t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, {passive:true});
  canvas.addEventListener('touchend', function(e){
    if(!touchStart) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    if(Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    var x, y;
    if(Math.abs(dx) > Math.abs(dy)){ x = dx > 0 ? 1 : -1; y = 0; }
    else { x = 0; y = dy > 0 ? 1 : -1; }
    if(!(x === -dir.x && y === -dir.y)) nextDir = {x:x,y:y};
    touchStart = null;
  });

  reset(); draw();
})();
</script>
</body>
</html>
